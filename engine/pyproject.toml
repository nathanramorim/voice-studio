[project]
name = "voice-studio"
version = "0.1.0"
description = "Motor local do voice-studio: clona a sua voz, gera narração e dubla vídeos."
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
  "typer>=0.12",
]

[project.optional-dependencies]
# Motor XTTS-v2 (licença do modelo: Coqui CPML, uso não comercial).
xtts = [
  "coqui-tts>=0.27",
  "six",
  "transformers<5",
  "torch<2.9",
  "torchaudio<2.9",
]

[project.scripts]
voice-studio = "voice_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_studio"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
